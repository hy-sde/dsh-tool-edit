# Bench arm: rich — the four-mode `edit` (replace / patch / apply_patch /
# hashline) shadows the host stock `edit`.
#
# Mounted as a plain agent-plane row: `tool-edit` registers `edit` into this
# agent's scoped catalog, shadowing the host tool-fs `edit` while `read`/
# `write` keep coming from the host. No isolate realm is needed — `tool-edit`
# publishes no service. No LSP seam is mounted (`tool-edit` is a consumer of
# an optional `lsp` service), matching the recorded rich arm's conditions.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working
      directory is {{cwd}}. Read a file before editing it, and make targeted
      edits with the `edit` tool, which supports four editing modes: `replace`
      (literal old_string -> new_string with fuzzy fallback), `patch`
      (structured JSON hunks), `apply_patch` (*** Begin Patch envelopes), and
      `hashline` (line-anchored compact patches).
    complete: true
    includeRuntimeContext: false

- id: tool-edit
  name: '@hy-sde-org/dsh-tool-edit'
  config:
    mode: auto
